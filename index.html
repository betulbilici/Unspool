<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pati & The Magic Yarn</title>
  <style>
    :root {
      --bg-dark: #1e1822;
      --bg-panel: #2d2435;
      --accent-warm: #f4a261;
      --accent-gold: #e76f51;
      --yarn-pink: #ff6b8b;
      --text-light: #fefae0;
      --text-muted: #d4a373;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #2e2136 0%, #15101a 100%);
      color: var(--text-light);
      font-family: 'Courier New', Courier, monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      width: 960px;
      height: 540px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 4px #4a3857, 0 0 20px rgba(244, 162, 97, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #251c2e;
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* HUD Overlay */
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-card {
      background: rgba(30, 24, 34, 0.75);
      backdrop-filter: blur(4px);
      border: 2px solid #5a456a;
      border-radius: 6px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: bold;
      color: var(--text-light);
      text-shadow: 1px 1px 0 #000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .yarn-meter-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .yarn-meter-bar {
      width: 140px;
      height: 14px;
      background: #19121f;
      border: 1px solid #795d8f;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .yarn-meter-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #e76f51, #ff6b8b);
      transition: width 0.1s ease-out;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 12px;
      color: var(--text-muted);
    }

    .hud-badge {
      background: rgba(20, 16, 24, 0.6);
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
  <!-- Matter.js Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <div id="game-wrapper">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    
    <div id="hud-overlay">
      <div class="hud-top">
        <div class="hud-card" id="level-title">
          <span style="color: var(--accent-warm);">STAGE 1:</span> Living Room Floor
        </div>
        <div class="hud-card yarn-meter-container">
          <span>YARN</span>
          <div class="yarn-meter-bar">
            <div class="yarn-meter-fill" id="yarn-bar-fill"></div>
          </div>
          <span id="yarn-percent">100%</span>
        </div>
      </div>
      <div class="hud-bottom">
        <div class="hud-badge">Controls: [A/D] Move | [W/Space] Jump | [R] Restart</div>
        <div class="hud-badge" id="fps-badge">60 FPS</div>
      </div>
    </div>
  </div>

  <script>
    // --- Milestone 1: Engine Initialization & Physics Loop ---
    const CanvasWidth = 960;
    const CanvasHeight = 540;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Matter.js Aliases
    const { Engine, World, Bodies, Body, Vector, Composite } = Matter;

    // Game Physics Engine
    const engine = Engine.create({
      gravity: { x: 0, y: 1.2, scale: 0.001 }
    });
    const world = engine.world;

    // Setup Boundary Walls
    const wallOptions = { isStatic: true, friction: 0.8, restitution: 0.1 };
    const ground = Bodies.rectangle(CanvasWidth / 2, CanvasHeight - 20, CanvasWidth, 40, wallOptions);
    const leftWall = Bodies.rectangle(-10, CanvasHeight / 2, 20, CanvasHeight, wallOptions);
    const rightWall = Bodies.rectangle(CanvasWidth + 10, CanvasHeight / 2, 20, CanvasHeight, wallOptions);
    const ceiling = Bodies.rectangle(CanvasWidth / 2, -10, CanvasWidth, 20, wallOptions);

    Composite.add(world, [ground, leftWall, rightWall, ceiling]);

    // Game Loop Variables
    let lastTime = performance.now();
    let frameCount = 0;
    let lastFpsUpdate = performance.now();
    let currentFps = 60;

    // Input State
    const keys = {
      left: false,
      right: false,
      up: false,
      space: false,
      reset: false
    };

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.up = true;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
      if (e.code === 'KeyR') keys.reset = true;
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.up = false;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
      if (e.code === 'KeyR') keys.reset = false;
    });

    // Render Background Grid / Warm Floor placeholder for Milestone 1
    function renderBackground() {
      // Warm living room gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, CanvasHeight);
      bgGrad.addColorStop(0, '#2e1f38');
      bgGrad.addColorStop(0.7, '#24172e');
      bgGrad.addColorStop(1, '#1b1123');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, CanvasWidth, CanvasHeight);

      // Parquet floor styling on ground
      ctx.fillStyle = '#4a2818';
      ctx.fillRect(0, CanvasHeight - 40, CanvasWidth, 40);
      ctx.fillStyle = '#6b3a20';
      ctx.fillRect(0, CanvasHeight - 40, CanvasWidth, 4);

      // Floor plank lines
      ctx.strokeStyle = '#381e12';
      ctx.lineWidth = 2;
      for (let x = 0; x < CanvasWidth; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, CanvasHeight - 40);
        ctx.lineTo(x, CanvasHeight);
        ctx.stroke();
      }
    }

    // Main Game Loop
    function gameLoop(now) {
      const delta = Math.min(now - lastTime, 100);
      lastTime = now;

      // Update Physics Engine with fixed sub-steps
      Engine.update(engine, 1000 / 60);

      // FPS tracking
      frameCount++;
      if (now - lastFpsUpdate >= 1000) {
        currentFps = frameCount;
        frameCount = 0;
        lastFpsUpdate = now;
        document.getElementById('fps-badge').textContent = `${currentFps} FPS`;
      }

      // Render Scene
      ctx.clearRect(0, 0, CanvasWidth, CanvasHeight);
      renderBackground();

      requestAnimationFrame(gameLoop);
    }

    // Start Game
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
