<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pati & The Magic Yarn</title>
  <style>
    :root {
      --bg-dark: #1e1822;
      --bg-panel: #2d2435;
      --accent-warm: #f4a261;
      --accent-gold: #e76f51;
      --yarn-pink: #ff6b8b;
      --text-light: #fefae0;
      --text-muted: #d4a373;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #2e2136 0%, #15101a 100%);
      color: var(--text-light);
      font-family: 'Courier New', Courier, monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      width: 960px;
      height: 540px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 4px #4a3857, 0 0 20px rgba(244, 162, 97, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #251c2e;
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* HUD Overlay */
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-card {
      background: rgba(30, 24, 34, 0.75);
      backdrop-filter: blur(4px);
      border: 2px solid #5a456a;
      border-radius: 6px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: bold;
      color: var(--text-light);
      text-shadow: 1px 1px 0 #000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .yarn-meter-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .yarn-meter-bar {
      width: 140px;
      height: 14px;
      background: #19121f;
      border: 1px solid #795d8f;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .yarn-meter-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #e76f51, #ff6b8b);
      transition: width 0.1s ease-out;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 12px;
      color: var(--text-muted);
    }

    .hud-badge {
      background: rgba(20, 16, 24, 0.6);
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
  <!-- Matter.js Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <div id="game-wrapper">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    
    <div id="hud-overlay">
      <div class="hud-top">
        <div class="hud-card" id="level-title">
          <span style="color: var(--accent-warm);">STAGE 1:</span> Living Room Floor
        </div>
        <div class="hud-card yarn-meter-container">
          <span>YARN</span>
          <div class="yarn-meter-bar">
            <div class="yarn-meter-fill" id="yarn-bar-fill"></div>
          </div>
          <span id="yarn-percent">100%</span>
        </div>
        <button id="sound-btn" class="hud-card hud-btn" style="cursor: pointer; pointer-events: auto;">
          <span id="sound-icon">🔊</span> <span id="sound-text">SOUND ON</span>
        </button>
      </div>
      <div class="hud-bottom">
        <div class="hud-badge">Controls: [A/D] Move | [W/Space] Jump | [M] Mute | [R] Restart</div>
        <div class="hud-badge" id="fps-badge">60 FPS</div>
      </div>
    </div>
  </div>

  <script>
    // --- Milestone 2: Procedural Web Audio Engine (Retro SFX) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.isUnlocked = false;

        // Rolling sound node references
        this.rollGain = null;
        this.rollFilter = null;
        this.rollSource = null;
      }

      init() {
        if (this.isUnlocked) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.isUnlocked = true;
          this.setupRollingLoop();
        } catch (e) {
          console.warn('Web Audio API not supported:', e);
        }
      }

      unlock() {
        if (!this.isUnlocked) {
          this.init();
        } else if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.rollGain) {
          this.rollGain.gain.setValueAtTime(0, this.ctx.currentTime);
        }
        return this.muted;
      }

      // Continuous rolling sound generator using filtered noise buffer
      setupRollingLoop() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 2;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        this.rollFilter = this.ctx.createBiquadFilter();
        this.rollFilter.type = 'lowpass';
        this.rollFilter.frequency.value = 160;

        this.rollGain = this.ctx.createGain();
        this.rollGain.gain.value = 0;

        whiteNoise.connect(this.rollFilter);
        this.rollFilter.connect(this.rollGain);
        this.rollGain.connect(this.ctx.destination);
        whiteNoise.start(0);
        this.rollSource = whiteNoise;
      }

      updateRollingSound(speed) {
        if (!this.ctx || this.muted || !this.rollGain) return;
        const now = this.ctx.currentTime;
        const normSpeed = Math.min(Math.max(speed, 0), 15);

        if (normSpeed > 0.4) {
          const targetGain = Math.min((normSpeed / 15) * 0.16, 0.16);
          const targetFreq = 160 + (normSpeed / 15) * 450;
          this.rollGain.gain.setTargetAtTime(targetGain, now, 0.08);
          this.rollFilter.frequency.setTargetAtTime(targetFreq, now, 0.08);
        } else {
          this.rollGain.gain.setTargetAtTime(0, now, 0.08);
        }
      }

      // Jump sound: classic snappy 8-bit upward frequency glide
      playJump() {
        if (!this.ctx || this.muted) return;
        this.unlock();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }

      // Meow sound: cute kitten vocalization with dual pitch bend and vibrato
      playMeow() {
        if (!this.ctx || this.muted) return;
        this.unlock();
        const now = this.ctx.currentTime;
        const duration = 0.38;

        const osc = this.ctx.createOscillator();
        const vibrato = this.ctx.createOscillator();
        const vibratoGain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        // Vibrato setup
        vibrato.frequency.value = 9;
        vibratoGain.gain.value = 18;
        vibrato.connect(osc.frequency);

        osc.type = 'sawtooth';
        // Kitty meow pitch curve: rising start, peak, slow descending purr
        osc.frequency.setValueAtTime(460, now);
        osc.frequency.exponentialRampToValueAtTime(840, now + 0.12);
        osc.frequency.exponentialRampToValueAtTime(540, now + duration);

        // Vocal tract formant filter
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(950, now);
        filter.frequency.linearRampToValueAtTime(1400, now + 0.14);
        filter.frequency.linearRampToValueAtTime(800, now + duration);
        filter.Q.value = 4.5;

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.06);
        gain.gain.setValueAtTime(0.2, now + 0.22);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        vibrato.start(now);
        osc.start(now);
        vibrato.stop(now + duration);
        osc.stop(now + duration);
      }

      // Springboard sound: comical bouncy "boing"
      playSpring() {
        if (!this.ctx || this.muted) return;
        this.unlock();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(580, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.28);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.32);
      }

      // Pressure switch activation: solid mechanical clunk
      playSwitch(active = true) {
        if (!this.ctx || this.muted) return;
        this.unlock();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'square';
        const startFreq = active ? 440 : 280;
        const endFreq = active ? 180 : 120;
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.08);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      // Spool checkpoint chime: glittering magical chord
      playSpoolPickup() {
        if (!this.ctx || this.muted) return;
        this.unlock();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + idx * 0.06;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        });
      }

      // Level clear fanfare: warm retro victory jingle
      playVictory() {
        if (!this.ctx || this.muted) return;
        this.unlock();
        const melody = [
          { freq: 523.25, time: 0, dur: 0.12 },    // C5
          { freq: 659.25, time: 0.12, dur: 0.12 }, // E5
          { freq: 783.99, time: 0.24, dur: 0.14 }, // G5
          { freq: 1046.50, time: 0.38, dur: 0.35 } // C6
        ];
        melody.forEach(note => {
          const startTime = this.ctx.currentTime + note.time;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.freq, startTime);

          gain.gain.setValueAtTime(0.24, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.dur);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + note.dur + 0.05);
        });
      }
    }

    const sound = new SoundEngine();

    // Sound button toggle
    const soundBtn = document.getElementById('sound-btn');
    const soundIcon = document.getElementById('sound-icon');
    const soundText = document.getElementById('sound-text');

    soundBtn.addEventListener('click', () => {
      sound.unlock();
      const isMuted = sound.toggleMute();
      soundIcon.textContent = isMuted ? '🔇' : '🔊';
      soundText.textContent = isMuted ? 'SOUND OFF' : 'SOUND ON';
    });

    // --- Milestone 3: Protagonist "Pati" Character Controller & Procedural Animation ---
    class PatiController {
      constructor(startX, startY) {
        this.width = 36;
        this.height = 30;
        this.facing = 1; // 1 = right, -1 = left
        this.isGrounded = false;
        this.groundBody = null;

        // Platformer jump feel & coyote time
        this.coyoteTimer = 0;
        this.maxCoyoteTime = 130; // ms
        this.jumpBufferTimer = 0;
        this.maxJumpBuffer = 120; // ms
        this.moveSpeed = 4.6;
        this.jumpForce = -8.2;

        // Animation state
        this.animTimer = 0;
        this.walkCycle = 0;
        this.squashX = 1;
        this.squashY = 1;
        this.tailAngle = 0;
        this.blinkTimer = 2000;
        this.isBlinking = false;
        this.wasGroundedLastFrame = false;

        // Create Matter.js physics body
        this.body = Bodies.rectangle(startX, startY, this.width, this.height, {
          chamfer: { radius: 10 },
          friction: 0.1,
          frictionAir: 0.03,
          restitution: 0.0,
          inertia: Infinity, // Prevent rotating
          label: 'pati'
        });

        Composite.add(world, this.body);
      }

      reset(x, y) {
        Body.setPosition(this.body, { x, y });
        Body.setVelocity(this.body, { x: 0, y: 0 });
        this.isGrounded = false;
        this.coyoteTimer = 0;
        this.jumpBufferTimer = 0;
      }

      checkGround(allBodies) {
        // Raycast-like sensor: check small box beneath Pati's feet
        const feetY = this.body.position.y + this.height / 2 + 3;
        const feetLeft = this.body.position.x - this.width / 2 + 4;
        const feetRight = this.body.position.x + this.width / 2 - 4;

        let grounded = false;
        let groundObj = null;

        for (const b of allBodies) {
          if (b === this.body || b.isSensor) continue;
          // Check AABB bounding box beneath feet
          if (
            feetRight > b.bounds.min.x &&
            feetLeft < b.bounds.max.x &&
            feetY >= b.bounds.min.y &&
            feetY <= b.bounds.min.y + 12
          ) {
            grounded = true;
            groundObj = b;
            break;
          }
        }

        return { grounded, groundObj };
      }

      update(delta, input, dynamicBodies) {
        this.animTimer += delta;

        // Ground detection
        const { grounded, groundObj } = this.checkGround(Composite.allBodies(world));
        this.isGrounded = grounded;
        this.groundBody = groundObj;

        // Landing squash and sound
        if (!this.wasGroundedLastFrame && this.isGrounded && Math.abs(this.body.velocity.y) > 2) {
          this.squashX = 1.25;
          this.squashY = 0.75;
        }
        this.wasGroundedLastFrame = this.isGrounded;

        // Smooth squash/stretch return
        this.squashX += (1 - this.squashX) * 0.18;
        this.squashY += (1 - this.squashY) * 0.18;

        // Coyote time update
        if (this.isGrounded) {
          this.coyoteTimer = this.maxCoyoteTime;
        } else {
          this.coyoteTimer = Math.max(0, this.coyoteTimer - delta);
        }

        // Jump buffer update
        if (input.up) {
          this.jumpBufferTimer = this.maxJumpBuffer;
        } else {
          this.jumpBufferTimer = Math.max(0, this.jumpBufferTimer - delta);
        }

        // Horizontal Movement
        let targetVx = 0;
        if (input.left) {
          targetVx -= this.moveSpeed;
          this.facing = -1;
        }
        if (input.right) {
          targetVx += this.moveSpeed;
          this.facing = 1;
        }

        // Smooth acceleration & responsiveness
        const currentVx = this.body.velocity.x;
        const newVx = currentVx + (targetVx - currentVx) * (this.isGrounded ? 0.35 : 0.2);
        Body.setVelocity(this.body, { x: newVx, y: this.body.velocity.y });

        // Push nearby dynamic bodies (such as yarn ball)
        if (Math.abs(targetVx) > 0.1) {
          for (const dBody of dynamicBodies) {
            if (dBody === this.body) continue;
            const dist = Vector.magnitude(Vector.sub(dBody.position, this.body.position));
            const pushRange = (this.width / 2) + (dBody.circleRadius || 20) + 6;

            if (dist < pushRange) {
              const dx = dBody.position.x - this.body.position.x;
              // Push in the direction Pati is walking
              if ((this.facing > 0 && dx > 0) || (this.facing < 0 && dx < 0)) {
                const pushStrength = 0.003 * Math.min(dBody.mass, 2.5);
                Body.applyForce(dBody, dBody.position, {
                  x: this.facing * pushStrength,
                  y: -0.0005
                });
              }
            }
          }
        }

        // Execute Jump (Coyote Time + Jump Buffer)
        if (this.jumpBufferTimer > 0 && this.coyoteTimer > 0) {
          Body.setVelocity(this.body, { x: this.body.velocity.x, y: this.jumpForce });
          this.jumpBufferTimer = 0;
          this.coyoteTimer = 0;
          this.isGrounded = false;
          this.squashX = 0.8;
          this.squashY = 1.3;
          sound.playJump();

          // Occasional playful meow on jump!
          if (Math.random() < 0.18) {
            setTimeout(() => sound.playMeow(), 80);
          }
        }

        // Variable Jump Height: cut velocity if player lets go of jump key mid-rise
        if (!input.up && this.body.velocity.y < -2) {
          Body.setVelocity(this.body, { x: this.body.velocity.x, y: this.body.velocity.y * 0.7 });
        }

        // Walk cycle animation speed
        if (this.isGrounded && Math.abs(this.body.velocity.x) > 0.3) {
          this.walkCycle += delta * 0.015 * Math.abs(this.body.velocity.x);
        } else {
          this.walkCycle = 0;
        }

        // Blinking logic
        this.blinkTimer -= delta;
        if (this.blinkTimer <= 0) {
          this.isBlinking = true;
          if (this.blinkTimer <= -140) {
            this.isBlinking = false;
            this.blinkTimer = 2200 + Math.random() * 3000;
          }
        }
      }

      render(ctx) {
        const x = this.body.position.x;
        const y = this.body.position.y;
        const vx = this.body.velocity.x;
        const vy = this.body.velocity.y;

        ctx.save();
        ctx.translate(x, y + 2); // align feet
        ctx.scale(this.facing * this.squashX, this.squashY);

        // Ground shadow
        ctx.save();
        ctx.fillStyle = 'rgba(15, 10, 20, 0.35)';
        ctx.beginPath();
        ctx.ellipse(0, this.height / 2 - 2, this.width / 2 + 2, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const time = this.animTimer * 0.005;
        const breathe = Math.sin(time * 3) * 0.8;

        // 1. Fluffy Animated Tail
        ctx.save();
        const tailWag = Math.sin(time * 5) * 0.25 + (Math.abs(vx) > 0.5 ? Math.sin(this.walkCycle * 2) * 0.35 : 0);
        const tailLift = vy < -1 ? -0.4 : (vy > 1 ? 0.3 : 0);
        
        ctx.beginPath();
        ctx.moveTo(-14, 2);
        ctx.quadraticCurveTo(-26, -6 + tailWag * 12 + tailLift * 8, -28 + Math.sin(time * 4) * 4, -18 + tailWag * 16);
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#f5f3f7';
        ctx.stroke();

        // Tail tip fluffy highlight
        ctx.beginPath();
        ctx.arc(-28 + Math.sin(time * 4) * 4, -18 + tailWag * 16, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();

        // 2. Rear Paws (Animated trot)
        const rearPawOffset = Math.sin(this.walkCycle) * 4;
        ctx.fillStyle = '#eae6ee';
        ctx.beginPath();
        ctx.roundRect(-12 + rearPawOffset, 8, 8, 8, 4);
        ctx.fill();

        // 3. Chubby Body (White British Shorthair)
        ctx.save();
        // Body shadow / depth gradient
        const bodyGrad = ctx.createRadialGradient(2, -2, 4, 0, 0, 22);
        bodyGrad.addColorStop(0, '#ffffff');
        bodyGrad.addColorStop(0.75, '#f4f1f7');
        bodyGrad.addColorStop(1, '#dfd9e6');

        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        // Chubby pear/capsule shape
        ctx.ellipse(0, 0 + breathe, 18, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        // Subtle soft fur rim
        ctx.strokeStyle = '#d0c8d8';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();

        // 4. Front Paws
        const frontPawOffset = Math.sin(this.walkCycle + Math.PI) * 4;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(4 + frontPawOffset, 9, 9, 7, 3);
        ctx.fill();

        // 5. Cute Head & Chubby Cheeks
        ctx.save();
        const headX = 6;
        const headY = -6 + breathe * 0.5;

        // Ears (Behind head)
        // Left ear
        ctx.fillStyle = '#f2eef6';
        ctx.beginPath();
        ctx.moveTo(headX - 6, headY - 8);
        ctx.lineTo(headX - 10, headY - 20);
        ctx.lineTo(headX - 1, headY - 12);
        ctx.closePath();
        ctx.fill();
        // Inner pink left ear
        ctx.fillStyle = '#ffaec9';
        ctx.beginPath();
        ctx.moveTo(headX - 6, headY - 9);
        ctx.lineTo(headX - 9, headY - 17);
        ctx.lineTo(headX - 2, headY - 12);
        ctx.closePath();
        ctx.fill();

        // Right ear
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(headX + 4, headY - 10);
        ctx.lineTo(headX + 8, headY - 21);
        ctx.lineTo(headX + 13, headY - 8);
        ctx.closePath();
        ctx.fill();
        // Inner pink right ear
        ctx.fillStyle = '#ffaec9';
        ctx.beginPath();
        ctx.moveTo(headX + 5, headY - 10);
        ctx.lineTo(headX + 8, headY - 18);
        ctx.lineTo(headX + 11, headY - 9);
        ctx.closePath();
        ctx.fill();

        // Head base circle
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(headX, headY, 13, 0, Math.PI * 2);
        ctx.fill();

        // Chubby cheeks pads
        ctx.beginPath();
        ctx.arc(headX + 4, headY + 5, 6, 0, Math.PI * 2);
        ctx.arc(headX - 2, headY + 5, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = '#f8f6fb';
        ctx.fill();

        // Rosy blush on cheeks
        ctx.fillStyle = 'rgba(255, 174, 201, 0.4)';
        ctx.beginPath();
        ctx.ellipse(headX + 6, headY + 4, 3.5, 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Whiskers (3 cute delicate lines)
        ctx.strokeStyle = '#c5bdce';
        ctx.lineWidth = 1;
        ctx.beginPath();
        // Top whisker
        ctx.moveTo(headX + 9, headY + 3);
        ctx.lineTo(headX + 18, headY + 1);
        // Middle whisker
        ctx.moveTo(headX + 10, headY + 5);
        ctx.lineTo(headX + 19, headY + 6);
        // Bottom whisker
        ctx.moveTo(headX + 9, headY + 7);
        ctx.lineTo(headX + 17, headY + 11);
        ctx.stroke();

        // Big Amber / Golden Eyes
        if (this.isBlinking) {
          // Closed happy eye line ^_^
          ctx.strokeStyle = '#5a4634';
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(headX + 4, headY - 1, 4, Math.PI * 0.9, Math.PI * 2.1);
          ctx.stroke();
        } else {
          // Eye socket
          ctx.fillStyle = '#2b1b17';
          ctx.beginPath();
          ctx.ellipse(headX + 4, headY - 1, 4.5, 5.5, 0.1, 0, Math.PI * 2);
          ctx.fill();

          // Amber/Golden Iris
          const eyeGrad = ctx.createLinearGradient(headX + 2, headY - 5, headX + 6, headY + 3);
          eyeGrad.addColorStop(0, '#f39c12');
          eyeGrad.addColorStop(0.5, '#f1c40f');
          eyeGrad.addColorStop(1, '#e67e22');
          ctx.fillStyle = eyeGrad;
          ctx.beginPath();
          ctx.ellipse(headX + 4, headY - 1, 3.8, 4.8, 0.1, 0, Math.PI * 2);
          ctx.fill();

          // Kitten Pupil (slight vertical oval)
          ctx.fillStyle = '#1a0d00';
          ctx.beginPath();
          ctx.ellipse(headX + 4.5, headY - 1, 2, 3.8, 0.1, 0, Math.PI * 2);
          ctx.fill();

          // Shiny Glint Highlights (Big anime catchlight + secondary sparkle)
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(headX + 3.2, headY - 3, 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(headX + 5.5, headY + 0.8, 1, 0, Math.PI * 2);
          ctx.fill();
        }

        // Tiny pink nose & mouth
        ctx.fillStyle = '#ff758f';
        ctx.beginPath();
        ctx.moveTo(headX + 9, headY + 3);
        ctx.lineTo(headX + 11.5, headY + 3);
        ctx.lineTo(headX + 10.2, headY + 5);
        ctx.closePath();
        ctx.fill();

        // Kitten cute inverted mouth
        ctx.strokeStyle = '#8d7088';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(headX + 8.5, headY + 6, 2, 0, Math.PI * 0.9);
        ctx.stroke();

        ctx.restore(); // Head
        ctx.restore(); // Main transform
      }
    }

    // --- Milestone 4: Dynamic Yarn Ball Mechanic & Wool Thread System ---
    class YarnBall {
      constructor(startX, startY) {
        this.maxRadius = 30;
        this.minRadius = 12;
        this.currentRadius = this.maxRadius;
        this.lastX = startX;
        this.lastY = startY;
        this.threadPoints = [];
        this.lastThreadDropDist = 0;
        this.unspoolRate = 0.0075; // radius shrink per pixel rolled

        // Create dynamic circle body in Matter.js
        this.body = Bodies.circle(startX, startY, this.maxRadius, {
          restitution: 0.3,
          friction: 0.75,
          frictionStatic: 0.9,
          density: 0.003, // Heavier when large
          label: 'yarn'
        });

        Composite.add(world, this.body);
      }

      reset(x, y, radius = 30) {
        Body.setPosition(this.body, { x, y });
        Body.setVelocity(this.body, { x: 0, y: 0 });
        Body.setAngularVelocity(this.body, 0);
        Body.setAngle(this.body, 0);

        // Reset scale
        const scaleFactor = radius / this.currentRadius;
        Body.scale(this.body, scaleFactor, scaleFactor);
        this.currentRadius = radius;
        this.lastX = x;
        this.lastY = y;
        this.threadPoints = [];
        this.lastThreadDropDist = 0;
      }

      restoreFull() {
        if (this.currentRadius < this.maxRadius) {
          const scaleFactor = this.maxRadius / this.currentRadius;
          Body.scale(this.body, scaleFactor, scaleFactor);
          this.currentRadius = this.maxRadius;
          sound.playSpoolPickup();
        }
      }

      update(delta) {
        const x = this.body.position.x;
        const y = this.body.position.y;
        const dx = x - this.lastX;
        const dy = y - this.lastY;
        const dist = Math.hypot(dx, dy);

        const speed = Math.hypot(this.body.velocity.x, this.body.velocity.y);
        const rollingSpeed = Math.abs(this.body.angularVelocity) * this.currentRadius;

        // Sound update for rolling
        sound.updateRollingSound(speed + rollingSpeed);

        // Unspooling: Shrink radius when rolling along surfaces
        if (dist > 0.5 && this.currentRadius > this.minRadius) {
          const shrinkAmount = dist * this.unspoolRate;
          const targetRadius = Math.max(this.minRadius, this.currentRadius - shrinkAmount);

          if (targetRadius !== this.currentRadius) {
            const scale = targetRadius / this.currentRadius;
            Body.scale(this.body, scale, scale);
            this.currentRadius = targetRadius;
          }
        }

        // Thread Trail on ground: record trail point every 14px
        this.lastThreadDropDist += dist;
        if (this.lastThreadDropDist > 14) {
          this.lastThreadDropDist = 0;
          // Drop thread point at bottom of yarn ball
          const groundY = y + this.currentRadius;
          this.threadPoints.push({ x, y: groundY });
          // Keep thread trail optimized
          if (this.threadPoints.length > 250) {
            this.threadPoints.shift();
          }
        }

        this.lastX = x;
        this.lastY = y;

        // Update HUD Yarn Gauge
        const yarnPct = Math.round(((this.currentRadius - this.minRadius) / (this.maxRadius - this.minRadius)) * 100);
        document.getElementById('yarn-bar-fill').style.width = `${yarnPct}%`;
        document.getElementById('yarn-percent').textContent = `${yarnPct}%`;
      }

      render(ctx) {
        const x = this.body.position.x;
        const y = this.body.position.y;
        const angle = this.body.angle;
        const r = this.currentRadius;

        // 1. Render Unwound Thread Trail on Floor / Platforms
        if (this.threadPoints.length > 1) {
          ctx.save();
          ctx.strokeStyle = '#ff6b8b';
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.shadowColor = 'rgba(255, 107, 139, 0.4)';
          ctx.shadowBlur = 4;

          ctx.beginPath();
          ctx.moveTo(this.threadPoints[0].x, this.threadPoints[0].y);
          for (let i = 1; i < this.threadPoints.length; i++) {
            const p = this.threadPoints[i];
            ctx.lineTo(p.x, p.y);
          }
          // Connect last trail point to bottom edge of yarn ball
          ctx.lineTo(x, y + r - 2);
          ctx.stroke();
          ctx.restore();
        }

        // 2. Yarn Ball Shadow
        ctx.save();
        ctx.fillStyle = 'rgba(15, 10, 20, 0.4)';
        ctx.beginPath();
        ctx.ellipse(x, y + r - 1, r * 0.9, r * 0.25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 3. Dynamic Yarn Ball Procedural Woven Sphere
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        // Outer soft yarn fluff / fuzzies around perimeter
        ctx.strokeStyle = '#ffaec9';
        ctx.lineWidth = 1.2;
        const fuzzCount = 14;
        for (let i = 0; i < fuzzCount; i++) {
          const theta = (i / fuzzCount) * Math.PI * 2;
          const fx1 = Math.cos(theta) * (r - 2);
          const fy1 = Math.sin(theta) * (r - 2);
          const fx2 = Math.cos(theta) * (r + 3.5);
          const fy2 = Math.sin(theta) * (r + 3.5);
          ctx.beginPath();
          ctx.moveTo(fx1, fy1);
          ctx.lineTo(fx2, fy2);
          ctx.stroke();
        }

        // Base sphere gradient
        const sphereGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
        sphereGrad.addColorStop(0, '#ff8fa3');
        sphereGrad.addColorStop(0.65, '#ff4d6d');
        sphereGrad.addColorStop(1, '#c9184a');

        ctx.fillStyle = sphereGrad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        // Woven Thread Strands / Swirls
        ctx.strokeStyle = '#ff758f';
        ctx.lineWidth = Math.max(1.8, r * 0.09);
        ctx.lineCap = 'round';

        // Set 1: Spiral curved ribs
        for (let rad = r * 0.25; rad < r * 0.95; rad += r * 0.24) {
          ctx.beginPath();
          ctx.arc(0, 0, rad, -0.6, 2.2);
          ctx.stroke();
        }

        // Set 2: Cross-woven wound bands
        ctx.strokeStyle = '#c9184a';
        ctx.lineWidth = Math.max(1.5, r * 0.07);
        for (let rad = r * 0.35; rad < r * 0.9; rad += r * 0.26) {
          ctx.beginPath();
          ctx.arc(r * 0.15, -r * 0.1, rad, 1.2, 4.0);
          ctx.stroke();
        }

        // Specular highlight on top curve
        ctx.strokeStyle = 'rgba(255, 230, 240, 0.65)';
        ctx.lineWidth = Math.max(1.5, r * 0.08);
        ctx.beginPath();
        ctx.arc(-r * 0.2, -r * 0.2, r * 0.45, -1.8, -0.2);
        ctx.stroke();

        // Center cute wrap-band knot
        ctx.fillStyle = '#a4133c';
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.28, r * 0.14, 0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // --- Milestone 5: Interactive Puzzle Objects & Level Entity Framework ---
    
    // 1. Pressure Plate: weight-sensitive floor switch
    class PressurePlate {
      constructor(x, y, width = 60, requiredMinRadius = 22, onTrigger = null) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = 10;
        this.requiredMinRadius = requiredMinRadius;
        this.isPressed = false;
        this.depression = 0; // 0 (up) to 6 (down)
        this.onTrigger = onTrigger;

        // Static sensor body
        this.sensor = Bodies.rectangle(x, y + 2, width, 14, {
          isStatic: true,
          isSensor: true,
          label: 'pressure_plate'
        });
        Composite.add(world, this.sensor);
      }

      update(delta, pati, yarn) {
        // Calculate weight / size on the plate
        let totalWeight = 0;
        let meetsRequirement = false;

        // Check yarn ball
        const yarnX = yarn.body.position.x;
        const yarnY = yarn.body.position.y + yarn.currentRadius;
        if (
          yarnX >= this.x - this.width / 2 &&
          yarnX <= this.x + this.width / 2 &&
          Math.abs(yarnY - this.y) < 14
        ) {
          totalWeight += yarn.currentRadius;
          if (yarn.currentRadius >= this.requiredMinRadius) {
            meetsRequirement = true;
          }
        }

        // Check Pati
        const patiX = pati.body.position.x;
        const patiY = pati.body.position.y + pati.height / 2;
        if (
          patiX >= this.x - this.width / 2 &&
          patiX <= this.x + this.width / 2 &&
          Math.abs(patiY - this.y) < 16
        ) {
          totalWeight += 18; // Pati's kitten weight
          if (this.requiredMinRadius <= 18) {
            meetsRequirement = true;
          }
        }

        // Cat + Ball combo also activates
        if (totalWeight >= 34) {
          meetsRequirement = true;
        }

        const wasPressed = this.isPressed;
        this.isPressed = meetsRequirement;

        if (this.isPressed && !wasPressed) {
          sound.playSwitch(true);
          if (this.onTrigger) this.onTrigger(true);
        } else if (!this.isPressed && wasPressed) {
          sound.playSwitch(false);
          if (this.onTrigger) this.onTrigger(false);
        }

        // Animate depression
        const targetDepression = this.isPressed ? 6 : 0;
        this.depression += (targetDepression - this.depression) * 0.3;
      }

      render(ctx) {
        ctx.save();
        // Plate base frame (wood/brass)
        ctx.fillStyle = '#3a271d';
        ctx.fillRect(this.x - this.width / 2 - 4, this.y, this.width + 8, this.height);

        // Depressible pad (warm brass/copper with indicator light)
        const plateY = this.y + this.depression;
        const padGrad = ctx.createLinearGradient(0, plateY, 0, plateY + 6);
        padGrad.addColorStop(0, this.isPressed ? '#52b788' : '#e76f51');
        padGrad.addColorStop(1, this.isPressed ? '#2d6a4f' : '#b7472a');

        ctx.fillStyle = padGrad;
        ctx.beginPath();
        ctx.roundRect(this.x - this.width / 2, plateY, this.width, 6, 2);
        ctx.fill();

        // Center jewel / glyph
        ctx.fillStyle = this.isPressed ? '#95d5b2' : '#f4a261';
        ctx.beginPath();
        ctx.arc(this.x, plateY + 3, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // 2. Springboard: launches entities vertically with bouncy animation
    class Springboard {
      constructor(x, y, width = 50, launchVelocity = -13.8) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = 14;
        this.launchVelocity = launchVelocity;
        this.compression = 0; // 0 to 8
        this.cooldown = 0;

        // Static sensor body
        this.sensor = Bodies.rectangle(x, y + 2, width, 16, {
          isStatic: true,
          isSensor: true,
          label: 'springboard'
        });
        Composite.add(world, this.sensor);
      }

      update(delta, pati, yarn) {
        if (this.cooldown > 0) {
          this.cooldown -= delta;
        }

        // Check Pati bounce
        const px = pati.body.position.x;
        const py = pati.body.position.y + pati.height / 2;
        if (
          this.cooldown <= 0 &&
          px >= this.x - this.width / 2 &&
          px <= this.x + this.width / 2 &&
          py >= this.y - 6 &&
          py <= this.y + 14 &&
          pati.body.velocity.y >= -1
        ) {
          Body.setVelocity(pati.body, { x: pati.body.velocity.x, y: this.launchVelocity });
          pati.squashX = 0.65;
          pati.squashY = 1.45;
          this.compression = 8;
          this.cooldown = 220;
          sound.playSpring();
        }

        // Check Yarn Ball bounce
        const yx = yarn.body.position.x;
        const yy = yarn.body.position.y + yarn.currentRadius;
        if (
          this.cooldown <= 0 &&
          yx >= this.x - this.width / 2 &&
          yx <= this.x + this.width / 2 &&
          yy >= this.y - 6 &&
          yy <= this.y + 14 &&
          yarn.body.velocity.y >= -1
        ) {
          Body.setVelocity(yarn.body, { x: yarn.body.velocity.x, y: this.launchVelocity * 1.05 });
          this.compression = 8;
          this.cooldown = 220;
          sound.playSpring();
        }

        // Elastic return
        this.compression += (0 - this.compression) * 0.22;
      }

      render(ctx) {
        ctx.save();
        // Base plate
        ctx.fillStyle = '#2b1b17';
        ctx.fillRect(this.x - this.width / 2, this.y + 10, this.width, 4);

        // Spring coils (retro zigzag)
        const padY = this.y + this.compression;
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        const springTop = padY + 4;
        const springBottom = this.y + 10;
        ctx.moveTo(this.x - 12, springBottom);
        ctx.lineTo(this.x - 6, (springTop + springBottom) / 2);
        ctx.lineTo(this.x + 6, (springTop + springBottom) / 2);
        ctx.lineTo(this.x + 12, springTop);
        ctx.stroke();

        // Top Launch Board
        const boardGrad = ctx.createLinearGradient(0, padY, 0, padY + 6);
        boardGrad.addColorStop(0, '#f39c12');
        boardGrad.addColorStop(1, '#d35400');
        ctx.fillStyle = boardGrad;
        ctx.beginPath();
        ctx.roundRect(this.x - this.width / 2, padY, this.width, 6, 2);
        ctx.fill();

        // Arrow indicator
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(this.x, padY - 2);
        ctx.lineTo(this.x - 5, padY + 3);
        ctx.lineTo(this.x + 5, padY + 3);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }
    }

    // 3. Yarn Spool: floating checkpoint pickup that rewinds yarn to full size
    class YarnSpool {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.baseY = y;
        this.radius = 16;
        this.collected = false;
        this.respawnTimer = 0;
        this.rot = 0;
        this.particles = [];

        this.sensor = Bodies.circle(x, y, 18, {
          isStatic: true,
          isSensor: true,
          label: 'spool'
        });
        Composite.add(world, this.sensor);
      }

      update(delta, pati, yarn) {
        this.rot += delta * 0.003;
        this.y = this.baseY + Math.sin(this.rot * 2) * 5;

        // Sparkle particles update
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= delta * 0.002;
          if (p.life <= 0) this.particles.splice(i, 1);
        }

        // Passive ambient sparkle
        if (Math.random() < 0.1 && !this.collected) {
          this.particles.push({
            x: this.x + (Math.random() - 0.5) * 20,
            y: this.y + (Math.random() - 0.5) * 20,
            vx: (Math.random() - 0.5) * 0.5,
            vy: -Math.random() * 0.8 - 0.2,
            life: 1,
            color: Math.random() < 0.5 ? '#ff758f' : '#ffeaa7'
          });
        }

        if (this.collected) {
          this.respawnTimer -= delta;
          if (this.respawnTimer <= 0) {
            this.collected = false;
          }
          return;
        }

        // Check overlap with Pati or Yarn Ball
        const distPati = Math.hypot(pati.body.position.x - this.x, pati.body.position.y - this.y);
        const distYarn = Math.hypot(yarn.body.position.x - this.x, yarn.body.position.y - this.y);

        if (distPati < 32 || distYarn < (yarn.currentRadius + 18)) {
          if (yarn.currentRadius < yarn.maxRadius - 1) {
            yarn.restoreFull();
            this.collected = true;
            this.respawnTimer = 4000; // Respawns after 4s

            // Burst sparkles
            for (let i = 0; i < 20; i++) {
              const ang = (i / 20) * Math.PI * 2;
              const spd = Math.random() * 2.5 + 1;
              this.particles.push({
                x: this.x,
                y: this.y,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd,
                life: 1,
                color: '#ff758f'
              });
            }
          }
        }
      }

      render(ctx) {
        // Render particles
        for (const p of this.particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5 * p.life, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        if (this.collected) return;

        ctx.save();
        ctx.translate(this.x, this.y);

        // Glow
        ctx.shadowColor = '#ff4d6d';
        ctx.shadowBlur = 10;

        // Wooden spool ends
        ctx.fillStyle = '#8b5a2b';
        ctx.beginPath();
        ctx.roundRect(-14, -14, 28, 6, 2);
        ctx.roundRect(-14, 8, 28, 6, 2);
        ctx.fill();

        // Pink wound thread core
        const threadGrad = ctx.createLinearGradient(-10, 0, 10, 0);
        threadGrad.addColorStop(0, '#ff4d6d');
        threadGrad.addColorStop(0.5, '#ff8fa3');
        threadGrad.addColorStop(1, '#ff4d6d');
        ctx.fillStyle = threadGrad;
        ctx.beginPath();
        ctx.roundRect(-10, -8, 20, 16, 2);
        ctx.fill();

        // Thread lines
        ctx.strokeStyle = '#c9184a';
        ctx.lineWidth = 1;
        for (let ly = -6; ly <= 6; ly += 3) {
          ctx.beginPath();
          ctx.moveTo(-10, ly);
          ctx.lineTo(10, ly);
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    // 4. Cat Bed Goal: Cozy wicker basket where Pati curls up to win
    class CatBedGoal {
      constructor(x, y, width = 64, height = 36) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
        this.reached = false;
        this.zzzParticles = [];
        this.zzzTimer = 0;

        // Static sensor
        this.sensor = Bodies.rectangle(x, y, width * 0.75, height * 0.6, {
          isStatic: true,
          isSensor: true,
          label: 'goal'
        });
        Composite.add(world, this.sensor);
      }

      update(delta, pati, onVictory) {
        // Zzz particles
        for (let i = this.zzzParticles.length - 1; i >= 0; i--) {
          const z = this.zzzParticles[i];
          z.x += z.vx;
          z.y += z.vy;
          z.scale += delta * 0.0008;
          z.life -= delta * 0.0012;
          if (z.life <= 0) this.zzzParticles.splice(i, 1);
        }

        if (this.reached) {
          this.zzzTimer += delta;
          if (this.zzzTimer > 400) {
            this.zzzTimer = 0;
            this.zzzParticles.push({
              x: this.x + 8,
              y: this.y - 10,
              vx: 0.35 + Math.random() * 0.2,
              vy: -0.6 - Math.random() * 0.3,
              scale: 0.8,
              life: 1
            });
          }
          return;
        }

        // Check if Pati stepped into the bed
        const px = pati.body.position.x;
        const py = pati.body.position.y;
        if (
          Math.abs(px - this.x) < this.width * 0.45 &&
          Math.abs(py - (this.y - 6)) < 24
        ) {
          this.reached = true;
          sound.playVictory();
          if (onVictory) onVictory();
        }
      }

      render(ctx) {
        ctx.save();

        // 1. Wicker Basket Base
        const basketY = this.y - 8;
        const wickerGrad = ctx.createLinearGradient(this.x - 30, 0, this.x + 30, 0);
        wickerGrad.addColorStop(0, '#7f4f24');
        wickerGrad.addColorStop(0.5, '#a68a64');
        wickerGrad.addColorStop(1, '#582f0e');

        ctx.fillStyle = wickerGrad;
        ctx.beginPath();
        ctx.ellipse(this.x, basketY + 8, this.width / 2, 14, 0, 0, Math.PI);
        ctx.fill();

        // Wicker weave texture lines
        ctx.strokeStyle = '#582f0e';
        ctx.lineWidth = 1.5;
        for (let ox = -20; ox <= 20; ox += 8) {
          ctx.beginPath();
          ctx.moveTo(this.x + ox, basketY + 6);
          ctx.lineTo(this.x + ox * 0.8, basketY + 18);
          ctx.stroke();
        }

        // 2. Fluffy Cushion
        ctx.fillStyle = '#fefae0';
        ctx.beginPath();
        ctx.ellipse(this.x, basketY + 4, this.width * 0.42, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // Soft pink fleece blanket folded in bed
        ctx.fillStyle = '#ffccd5';
        ctx.beginPath();
        ctx.ellipse(this.x - 6, basketY + 5, 14, 7, -0.2, 0, Math.PI * 2);
        ctx.fill();

        // Little embroidered paw on blanket
        ctx.fillStyle = '#ff758f';
        ctx.beginPath();
        ctx.arc(this.x - 6, basketY + 5, 2.5, 0, Math.PI * 2);
        ctx.arc(this.x - 9, basketY + 3, 1.2, 0, Math.PI * 2);
        ctx.arc(this.x - 6, basketY + 1.8, 1.2, 0, Math.PI * 2);
        ctx.arc(this.x - 3, basketY + 3, 1.2, 0, Math.PI * 2);
        ctx.fill();

        // 3. Sleeping Zzz particles
        for (const z of this.zzzParticles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, z.life);
          ctx.fillStyle = '#fefae0';
          ctx.font = `bold ${Math.round(14 * z.scale)}px 'Courier New', monospace`;
          ctx.fillText('Z', z.x, z.y);
          ctx.restore();
        }

        ctx.restore();
      }
    }

    // 5. Sliding Door / Ramp / Barrier mechanism actuated by switches
    class MechanicalDoor {
      constructor(x, y, width, height, openOffsetY = -70, isRamp = false) {
        this.originX = x;
        this.originY = y;
        this.width = width;
        this.height = height;
        this.openOffsetY = openOffsetY;
        this.isOpen = false;
        this.progress = 0; // 0 = closed, 1 = fully open
        this.isRamp = isRamp;

        this.body = Bodies.rectangle(x, y, width, height, {
          isStatic: true,
          label: 'door',
          friction: 0.8
        });
        Composite.add(world, this.body);
      }

      setOpen(open) {
        this.isOpen = open;
      }

      update(delta) {
        const targetProgress = this.isOpen ? 1 : 0;
        this.progress += (targetProgress - this.progress) * 0.08;

        const currentY = this.originY + this.openOffsetY * this.progress;
        Body.setPosition(this.body, { x: this.originX, y: currentY });
      }

      render(ctx) {
        const x = this.body.position.x;
        const y = this.body.position.y;

        ctx.save();
        if (this.isRamp) {
          // Wooden ramp style
          ctx.fillStyle = '#5c3d2e';
          ctx.fillRect(x - this.width / 2, y - this.height / 2, this.width, this.height);
          ctx.strokeStyle = '#b85d19';
          ctx.lineWidth = 2;
          ctx.strokeRect(x - this.width / 2, y - this.height / 2, this.width, this.height);
        } else {
          // Brass / Mahogany mechanical barrier
          const doorGrad = ctx.createLinearGradient(x - this.width / 2, 0, x + this.width / 2, 0);
          doorGrad.addColorStop(0, '#4a3525');
          doorGrad.addColorStop(0.5, '#734e32');
          doorGrad.addColorStop(1, '#3b281c');

          ctx.fillStyle = doorGrad;
          ctx.fillRect(x - this.width / 2, y - this.height / 2, this.width, this.height);

          // Mechanical rivets / brass bars
          ctx.strokeStyle = '#d4af37';
          ctx.lineWidth = 2;
          ctx.strokeRect(x - this.width / 2 + 3, y - this.height / 2 + 3, this.width - 6, this.height - 6);
        }
        ctx.restore();
      }
    }

    // Milestone 1 & 2 Engine setup
    const CanvasWidth = 960;
    const CanvasHeight = 540;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Matter.js Aliases
    const { Engine, World, Bodies, Body, Vector, Composite } = Matter;

    // Game Physics Engine
    const engine = Engine.create({
      gravity: { x: 0, y: 1.2, scale: 0.001 }
    });
    const world = engine.world;

    // Setup Boundary Walls
    const wallOptions = { isStatic: true, friction: 0.8, restitution: 0.1 };
    const ground = Bodies.rectangle(CanvasWidth / 2, CanvasHeight - 20, CanvasWidth, 40, wallOptions);
    const leftWall = Bodies.rectangle(-10, CanvasHeight / 2, 20, CanvasHeight, wallOptions);
    const rightWall = Bodies.rectangle(CanvasWidth + 10, CanvasHeight / 2, 20, CanvasHeight, wallOptions);
    const ceiling = Bodies.rectangle(CanvasWidth / 2, -10, CanvasWidth, 20, wallOptions);

    Composite.add(world, [ground, leftWall, rightWall, ceiling]);

    // Game Loop Variables
    let lastTime = performance.now();
    let frameCount = 0;
    let lastFpsUpdate = performance.now();
    let currentFps = 60;

    // Input State
    const keys = {
      left: false,
      right: false,
      up: false,
      space: false,
      reset: false
    };

    window.addEventListener('keydown', (e) => {
      sound.unlock();
      if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.up = true;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
      if (e.code === 'KeyR') keys.reset = true;
      if (e.code === 'KeyM') {
        const isMuted = sound.toggleMute();
        soundIcon.textContent = isMuted ? '🔇' : '🔊';
        soundText.textContent = isMuted ? 'SOUND OFF' : 'SOUND ON';
      }
    });

    window.addEventListener('click', () => {
      sound.unlock();
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.up = false;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
      if (e.code === 'KeyR') keys.reset = false;
    });

    // Render Background Grid / Warm Floor placeholder for Milestone 1
    function renderBackground() {
      // Warm living room gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, CanvasHeight);
      bgGrad.addColorStop(0, '#2e1f38');
      bgGrad.addColorStop(0.7, '#24172e');
      bgGrad.addColorStop(1, '#1b1123');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, CanvasWidth, CanvasHeight);

      // Parquet floor styling on ground
      ctx.fillStyle = '#4a2818';
      ctx.fillRect(0, CanvasHeight - 40, CanvasWidth, 40);
      ctx.fillStyle = '#6b3a20';
      ctx.fillRect(0, CanvasHeight - 40, CanvasWidth, 4);

      // Floor plank lines
      ctx.strokeStyle = '#381e12';
      ctx.lineWidth = 2;
      for (let x = 0; x < CanvasWidth; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, CanvasHeight - 40);
        ctx.lineTo(x, CanvasHeight);
        ctx.stroke();
      }
    }

    // Instantiate Player (Pati)
    const pati = new PatiController(140, CanvasHeight - 60);

    // Main Game Loop
    function gameLoop(now) {
      const delta = Math.min(now - lastTime, 50);
      lastTime = now;

      // Update Player Controller & Physics
      pati.update(delta, keys, []);

      // Update Physics Engine with fixed sub-steps
      Engine.update(engine, 1000 / 60);

      // FPS tracking
      frameCount++;
      if (now - lastFpsUpdate >= 1000) {
        currentFps = frameCount;
        frameCount = 0;
        lastFpsUpdate = now;
        document.getElementById('fps-badge').textContent = `${currentFps} FPS`;
      }

      // Render Scene
      ctx.clearRect(0, 0, CanvasWidth, CanvasHeight);
      renderBackground();

      // Render Player
      pati.render(ctx);

      requestAnimationFrame(gameLoop);
    }

    // Start Game
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
