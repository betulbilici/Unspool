<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pati & The Magic Yarn</title>
  <style>
    :root {
      --bg-dark: #1e1822;
      --bg-panel: #2d2435;
      --accent-warm: #f4a261;
      --accent-gold: #e76f51;
      --yarn-pink: #ff6b8b;
      --text-light: #fefae0;
      --text-muted: #d4a373;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #2e2136 0%, #15101a 100%);
      color: var(--text-light);
      font-family: 'Courier New', Courier, monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      width: 960px;
      height: 540px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 4px #4a3857, 0 0 20px rgba(244, 162, 97, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #251c2e;
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* HUD Overlay */
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-card {
      background: rgba(30, 24, 34, 0.75);
      backdrop-filter: blur(4px);
      border: 2px solid #5a456a;
      border-radius: 6px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: bold;
      color: var(--text-light);
      text-shadow: 1px 1px 0 #000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .yarn-meter-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .yarn-meter-bar {
      width: 140px;
      height: 14px;
      background: #19121f;
      border: 1px solid #795d8f;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .yarn-meter-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #e76f51, #ff6b8b);
      transition: width 0.1s ease-out;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 12px;
      color: var(--text-muted);
    }

    .hud-badge {
      background: rgba(20, 16, 24, 0.6);
      padding: 4px 8px;
      border-radius: 4px;
    }
  </style>
  <!-- Matter.js Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

  <div id="game-wrapper">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    
    <div id="hud-overlay">
      <div class="hud-top">
        <div class="hud-card" id="level-title">
          <span style="color: var(--accent-warm);">STAGE 1:</span> Living Room Floor
        </div>
        <div class="hud-card yarn-meter-container">
          <span>YARN</span>
          <div class="yarn-meter-bar">
            <div class="yarn-meter-fill" id="yarn-bar-fill"></div>
          </div>
          <span id="yarn-percent">100%</span>
        </div>
        <button id="sound-btn" class="hud-card hud-btn" style="cursor: pointer; pointer-events: auto;">
          <span id="sound-icon">🔊</span> <span id="sound-text">SOUND ON</span>
        </button>
      </div>
      <div class="hud-bottom">
        <div class="hud-badge">Controls: [A/D] Move | [W/Space] Jump | [M] Mute | [R] Restart</div>
        <div class="hud-badge" id="fps-badge">60 FPS</div>
      </div>
    </div>
  </div>

  <script>
    // --- Milestone 2: Procedural Web Audio Engine (Retro SFX) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.isUnlocked = false;

        // Rolling sound node references
        this.rollGain = null;
        this.rollFilter = null;
        this.rollSource = null;
      }

      init() {
        if (this.isUnlocked) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.isUnlocked = true;
          this.setupRollingLoop();
        } catch (e) {
          console.warn('Web Audio API not supported:', e);
        }
      }

      unlock() {
        if (!this.isUnlocked) {
          this.init();
        } else if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.rollGain) {
          this.rollGain.gain.setValueAtTime(0, this.ctx.currentTime);
        }
        return this.muted;
      }

      // Continuous rolling sound generator using filtered noise buffer
      setupRollingLoop() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 2;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        this.rollFilter = this.ctx.createBiquadFilter();
        this.rollFilter.type = 'lowpass';
        this.rollFilter.frequency.value = 160;

        this.rollGain = this.ctx.createGain();
        this.rollGain.gain.value = 0;

        whiteNoise.connect(this.rollFilter);
        this.rollFilter.connect(this.rollGain);
        this.rollGain.connect(this.ctx.destination);
        whiteNoise.start(0);
        this.rollSource = whiteNoise;
      }

      updateRollingSound(speed) {
        if (!this.ctx || this.muted || !this.rollGain) return;
        const now = this.ctx.currentTime;
        const normSpeed = Math.min(Math.max(speed, 0), 15);

        if (normSpeed > 0.4) {
          const targetGain = Math.min((normSpeed / 15) * 0.16, 0.16);
          const targetFreq = 160 + (normSpeed / 15) * 450;
          this.rollGain.gain.setTargetAtTime(targetGain, now, 0.08);
          this.rollFilter.frequency.setTargetAtTime(targetFreq, now, 0.08);
        } else {
          this.rollGain.gain.setTargetAtTime(0, now, 0.08);
        }
      }

      // Jump sound: classic snappy 8-bit upward frequency glide
      playJump() {
        if (!this.ctx || this.muted) return;
        this.unlock();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }

      // Meow sound: cute kitten vocalization with dual pitch bend and vibrato
      playMeow() {
        if (!this.ctx || this.muted) return;
        this.unlock();
        const now = this.ctx.currentTime;
        const duration = 0.38;

        const osc = this.ctx.createOscillator();
        const vibrato = this.ctx.createOscillator();
        const vibratoGain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        // Vibrato setup
        vibrato.frequency.value = 9;
        vibratoGain.gain.value = 18;
        vibrato.connect(osc.frequency);

        osc.type = 'sawtooth';
        // Kitty meow pitch curve: rising start, peak, slow descending purr
        osc.frequency.setValueAtTime(460, now);
        osc.frequency.exponentialRampToValueAtTime(840, now + 0.12);
        osc.frequency.exponentialRampToValueAtTime(540, now + duration);

        // Vocal tract formant filter
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(950, now);
        filter.frequency.linearRampToValueAtTime(1400, now + 0.14);
        filter.frequency.linearRampToValueAtTime(800, now + duration);
        filter.Q.value = 4.5;

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.06);
        gain.gain.setValueAtTime(0.2, now + 0.22);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        vibrato.start(now);
        osc.start(now);
        vibrato.stop(now + duration);
        osc.stop(now + duration);
      }

      // Springboard sound: comical bouncy "boing"
      playSpring() {
        if (!this.ctx || this.muted) return;
        this.unlock();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(580, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.28);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.32);
      }

      // Pressure switch activation: solid mechanical clunk
      playSwitch(active = true) {
        if (!this.ctx || this.muted) return;
        this.unlock();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'square';
        const startFreq = active ? 440 : 280;
        const endFreq = active ? 180 : 120;
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.08);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }

      // Spool checkpoint chime: glittering magical chord
      playSpoolPickup() {
        if (!this.ctx || this.muted) return;
        this.unlock();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const now = this.ctx.currentTime + idx * 0.06;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        });
      }

      // Level clear fanfare: warm retro victory jingle
      playVictory() {
        if (!this.ctx || this.muted) return;
        this.unlock();
        const melody = [
          { freq: 523.25, time: 0, dur: 0.12 },    // C5
          { freq: 659.25, time: 0.12, dur: 0.12 }, // E5
          { freq: 783.99, time: 0.24, dur: 0.14 }, // G5
          { freq: 1046.50, time: 0.38, dur: 0.35 } // C6
        ];
        melody.forEach(note => {
          const startTime = this.ctx.currentTime + note.time;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(note.freq, startTime);

          gain.gain.setValueAtTime(0.24, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.dur);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + note.dur + 0.05);
        });
      }
    }

    const sound = new SoundEngine();

    // Sound button toggle
    const soundBtn = document.getElementById('sound-btn');
    const soundIcon = document.getElementById('sound-icon');
    const soundText = document.getElementById('sound-text');

    soundBtn.addEventListener('click', () => {
      sound.unlock();
      const isMuted = sound.toggleMute();
      soundIcon.textContent = isMuted ? '🔇' : '🔊';
      soundText.textContent = isMuted ? 'SOUND OFF' : 'SOUND ON';
    });

    // --- Milestone 3: Protagonist "Pati" Character Controller & Procedural Animation ---
    class PatiController {
      constructor(startX, startY) {
        this.width = 36;
        this.height = 30;
        this.facing = 1; // 1 = right, -1 = left
        this.isGrounded = false;
        this.groundBody = null;

        // Platformer jump feel & coyote time
        this.coyoteTimer = 0;
        this.maxCoyoteTime = 130; // ms
        this.jumpBufferTimer = 0;
        this.maxJumpBuffer = 120; // ms
        this.moveSpeed = 4.6;
        this.jumpForce = -8.2;

        // Animation state
        this.animTimer = 0;
        this.walkCycle = 0;
        this.squashX = 1;
        this.squashY = 1;
        this.tailAngle = 0;
        this.blinkTimer = 2000;
        this.isBlinking = false;
        this.wasGroundedLastFrame = false;

        // Create Matter.js physics body
        this.body = Bodies.rectangle(startX, startY, this.width, this.height, {
          chamfer: { radius: 10 },
          friction: 0.1,
          frictionAir: 0.03,
          restitution: 0.0,
          inertia: Infinity, // Prevent rotating
          label: 'pati'
        });

        Composite.add(world, this.body);
      }

      reset(x, y) {
        Body.setPosition(this.body, { x, y });
        Body.setVelocity(this.body, { x: 0, y: 0 });
        this.isGrounded = false;
        this.coyoteTimer = 0;
        this.jumpBufferTimer = 0;
      }

      checkGround(allBodies) {
        // Raycast-like sensor: check small box beneath Pati's feet
        const feetY = this.body.position.y + this.height / 2 + 3;
        const feetLeft = this.body.position.x - this.width / 2 + 4;
        const feetRight = this.body.position.x + this.width / 2 - 4;

        let grounded = false;
        let groundObj = null;

        for (const b of allBodies) {
          if (b === this.body || b.isSensor) continue;
          // Check AABB bounding box beneath feet
          if (
            feetRight > b.bounds.min.x &&
            feetLeft < b.bounds.max.x &&
            feetY >= b.bounds.min.y &&
            feetY <= b.bounds.min.y + 12
          ) {
            grounded = true;
            groundObj = b;
            break;
          }
        }

        return { grounded, groundObj };
      }

      update(delta, input, dynamicBodies) {
        this.animTimer += delta;

        // Ground detection
        const { grounded, groundObj } = this.checkGround(Composite.allBodies(world));
        this.isGrounded = grounded;
        this.groundBody = groundObj;

        // Landing squash and sound
        if (!this.wasGroundedLastFrame && this.isGrounded && Math.abs(this.body.velocity.y) > 2) {
          this.squashX = 1.25;
          this.squashY = 0.75;
        }
        this.wasGroundedLastFrame = this.isGrounded;

        // Smooth squash/stretch return
        this.squashX += (1 - this.squashX) * 0.18;
        this.squashY += (1 - this.squashY) * 0.18;

        // Coyote time update
        if (this.isGrounded) {
          this.coyoteTimer = this.maxCoyoteTime;
        } else {
          this.coyoteTimer = Math.max(0, this.coyoteTimer - delta);
        }

        // Jump buffer update
        if (input.up) {
          this.jumpBufferTimer = this.maxJumpBuffer;
        } else {
          this.jumpBufferTimer = Math.max(0, this.jumpBufferTimer - delta);
        }

        // Horizontal Movement
        let targetVx = 0;
        if (input.left) {
          targetVx -= this.moveSpeed;
          this.facing = -1;
        }
        if (input.right) {
          targetVx += this.moveSpeed;
          this.facing = 1;
        }

        // Smooth acceleration & responsiveness
        const currentVx = this.body.velocity.x;
        const newVx = currentVx + (targetVx - currentVx) * (this.isGrounded ? 0.35 : 0.2);
        Body.setVelocity(this.body, { x: newVx, y: this.body.velocity.y });

        // Push nearby dynamic bodies (such as yarn ball)
        if (Math.abs(targetVx) > 0.1) {
          for (const dBody of dynamicBodies) {
            if (dBody === this.body) continue;
            const dist = Vector.magnitude(Vector.sub(dBody.position, this.body.position));
            const pushRange = (this.width / 2) + (dBody.circleRadius || 20) + 6;

            if (dist < pushRange) {
              const dx = dBody.position.x - this.body.position.x;
              // Push in the direction Pati is walking
              if ((this.facing > 0 && dx > 0) || (this.facing < 0 && dx < 0)) {
                const pushStrength = 0.003 * Math.min(dBody.mass, 2.5);
                Body.applyForce(dBody, dBody.position, {
                  x: this.facing * pushStrength,
                  y: -0.0005
                });
              }
            }
          }
        }

        // Execute Jump (Coyote Time + Jump Buffer)
        if (this.jumpBufferTimer > 0 && this.coyoteTimer > 0) {
          Body.setVelocity(this.body, { x: this.body.velocity.x, y: this.jumpForce });
          this.jumpBufferTimer = 0;
          this.coyoteTimer = 0;
          this.isGrounded = false;
          this.squashX = 0.8;
          this.squashY = 1.3;
          sound.playJump();

          // Occasional playful meow on jump!
          if (Math.random() < 0.18) {
            setTimeout(() => sound.playMeow(), 80);
          }
        }

        // Variable Jump Height: cut velocity if player lets go of jump key mid-rise
        if (!input.up && this.body.velocity.y < -2) {
          Body.setVelocity(this.body, { x: this.body.velocity.x, y: this.body.velocity.y * 0.7 });
        }

        // Walk cycle animation speed
        if (this.isGrounded && Math.abs(this.body.velocity.x) > 0.3) {
          this.walkCycle += delta * 0.015 * Math.abs(this.body.velocity.x);
        } else {
          this.walkCycle = 0;
        }

        // Blinking logic
        this.blinkTimer -= delta;
        if (this.blinkTimer <= 0) {
          this.isBlinking = true;
          if (this.blinkTimer <= -140) {
            this.isBlinking = false;
            this.blinkTimer = 2200 + Math.random() * 3000;
          }
        }
      }

      render(ctx) {
        const x = this.body.position.x;
        const y = this.body.position.y;
        const vx = this.body.velocity.x;
        const vy = this.body.velocity.y;

        ctx.save();
        ctx.translate(x, y + 2); // align feet
        ctx.scale(this.facing * this.squashX, this.squashY);

        // Ground shadow
        ctx.save();
        ctx.fillStyle = 'rgba(15, 10, 20, 0.35)';
        ctx.beginPath();
        ctx.ellipse(0, this.height / 2 - 2, this.width / 2 + 2, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const time = this.animTimer * 0.005;
        const breathe = Math.sin(time * 3) * 0.8;

        // 1. Fluffy Animated Tail
        ctx.save();
        const tailWag = Math.sin(time * 5) * 0.25 + (Math.abs(vx) > 0.5 ? Math.sin(this.walkCycle * 2) * 0.35 : 0);
        const tailLift = vy < -1 ? -0.4 : (vy > 1 ? 0.3 : 0);
        
        ctx.beginPath();
        ctx.moveTo(-14, 2);
        ctx.quadraticCurveTo(-26, -6 + tailWag * 12 + tailLift * 8, -28 + Math.sin(time * 4) * 4, -18 + tailWag * 16);
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#f5f3f7';
        ctx.stroke();

        // Tail tip fluffy highlight
        ctx.beginPath();
        ctx.arc(-28 + Math.sin(time * 4) * 4, -18 + tailWag * 16, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();

        // 2. Rear Paws (Animated trot)
        const rearPawOffset = Math.sin(this.walkCycle) * 4;
        ctx.fillStyle = '#eae6ee';
        ctx.beginPath();
        ctx.roundRect(-12 + rearPawOffset, 8, 8, 8, 4);
        ctx.fill();

        // 3. Chubby Body (White British Shorthair)
        ctx.save();
        // Body shadow / depth gradient
        const bodyGrad = ctx.createRadialGradient(2, -2, 4, 0, 0, 22);
        bodyGrad.addColorStop(0, '#ffffff');
        bodyGrad.addColorStop(0.75, '#f4f1f7');
        bodyGrad.addColorStop(1, '#dfd9e6');

        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        // Chubby pear/capsule shape
        ctx.ellipse(0, 0 + breathe, 18, 14, 0, 0, Math.PI * 2);
        ctx.fill();

        // Subtle soft fur rim
        ctx.strokeStyle = '#d0c8d8';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();

        // 4. Front Paws
        const frontPawOffset = Math.sin(this.walkCycle + Math.PI) * 4;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(4 + frontPawOffset, 9, 9, 7, 3);
        ctx.fill();

        // 5. Cute Head & Chubby Cheeks
        ctx.save();
        const headX = 6;
        const headY = -6 + breathe * 0.5;

        // Ears (Behind head)
        // Left ear
        ctx.fillStyle = '#f2eef6';
        ctx.beginPath();
        ctx.moveTo(headX - 6, headY - 8);
        ctx.lineTo(headX - 10, headY - 20);
        ctx.lineTo(headX - 1, headY - 12);
        ctx.closePath();
        ctx.fill();
        // Inner pink left ear
        ctx.fillStyle = '#ffaec9';
        ctx.beginPath();
        ctx.moveTo(headX - 6, headY - 9);
        ctx.lineTo(headX - 9, headY - 17);
        ctx.lineTo(headX - 2, headY - 12);
        ctx.closePath();
        ctx.fill();

        // Right ear
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(headX + 4, headY - 10);
        ctx.lineTo(headX + 8, headY - 21);
        ctx.lineTo(headX + 13, headY - 8);
        ctx.closePath();
        ctx.fill();
        // Inner pink right ear
        ctx.fillStyle = '#ffaec9';
        ctx.beginPath();
        ctx.moveTo(headX + 5, headY - 10);
        ctx.lineTo(headX + 8, headY - 18);
        ctx.lineTo(headX + 11, headY - 9);
        ctx.closePath();
        ctx.fill();

        // Head base circle
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(headX, headY, 13, 0, Math.PI * 2);
        ctx.fill();

        // Chubby cheeks pads
        ctx.beginPath();
        ctx.arc(headX + 4, headY + 5, 6, 0, Math.PI * 2);
        ctx.arc(headX - 2, headY + 5, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = '#f8f6fb';
        ctx.fill();

        // Rosy blush on cheeks
        ctx.fillStyle = 'rgba(255, 174, 201, 0.4)';
        ctx.beginPath();
        ctx.ellipse(headX + 6, headY + 4, 3.5, 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Whiskers (3 cute delicate lines)
        ctx.strokeStyle = '#c5bdce';
        ctx.lineWidth = 1;
        ctx.beginPath();
        // Top whisker
        ctx.moveTo(headX + 9, headY + 3);
        ctx.lineTo(headX + 18, headY + 1);
        // Middle whisker
        ctx.moveTo(headX + 10, headY + 5);
        ctx.lineTo(headX + 19, headY + 6);
        // Bottom whisker
        ctx.moveTo(headX + 9, headY + 7);
        ctx.lineTo(headX + 17, headY + 11);
        ctx.stroke();

        // Big Amber / Golden Eyes
        if (this.isBlinking) {
          // Closed happy eye line ^_^
          ctx.strokeStyle = '#5a4634';
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(headX + 4, headY - 1, 4, Math.PI * 0.9, Math.PI * 2.1);
          ctx.stroke();
        } else {
          // Eye socket
          ctx.fillStyle = '#2b1b17';
          ctx.beginPath();
          ctx.ellipse(headX + 4, headY - 1, 4.5, 5.5, 0.1, 0, Math.PI * 2);
          ctx.fill();

          // Amber/Golden Iris
          const eyeGrad = ctx.createLinearGradient(headX + 2, headY - 5, headX + 6, headY + 3);
          eyeGrad.addColorStop(0, '#f39c12');
          eyeGrad.addColorStop(0.5, '#f1c40f');
          eyeGrad.addColorStop(1, '#e67e22');
          ctx.fillStyle = eyeGrad;
          ctx.beginPath();
          ctx.ellipse(headX + 4, headY - 1, 3.8, 4.8, 0.1, 0, Math.PI * 2);
          ctx.fill();

          // Kitten Pupil (slight vertical oval)
          ctx.fillStyle = '#1a0d00';
          ctx.beginPath();
          ctx.ellipse(headX + 4.5, headY - 1, 2, 3.8, 0.1, 0, Math.PI * 2);
          ctx.fill();

          // Shiny Glint Highlights (Big anime catchlight + secondary sparkle)
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(headX + 3.2, headY - 3, 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(headX + 5.5, headY + 0.8, 1, 0, Math.PI * 2);
          ctx.fill();
        }

        // Tiny pink nose & mouth
        ctx.fillStyle = '#ff758f';
        ctx.beginPath();
        ctx.moveTo(headX + 9, headY + 3);
        ctx.lineTo(headX + 11.5, headY + 3);
        ctx.lineTo(headX + 10.2, headY + 5);
        ctx.closePath();
        ctx.fill();

        // Kitten cute inverted mouth
        ctx.strokeStyle = '#8d7088';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(headX + 8.5, headY + 6, 2, 0, Math.PI * 0.9);
        ctx.stroke();

        ctx.restore(); // Head
        ctx.restore(); // Main transform
      }
    }

    // Milestone 1 & 2 Engine setup
    const CanvasWidth = 960;
    const CanvasHeight = 540;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Matter.js Aliases
    const { Engine, World, Bodies, Body, Vector, Composite } = Matter;

    // Game Physics Engine
    const engine = Engine.create({
      gravity: { x: 0, y: 1.2, scale: 0.001 }
    });
    const world = engine.world;

    // Setup Boundary Walls
    const wallOptions = { isStatic: true, friction: 0.8, restitution: 0.1 };
    const ground = Bodies.rectangle(CanvasWidth / 2, CanvasHeight - 20, CanvasWidth, 40, wallOptions);
    const leftWall = Bodies.rectangle(-10, CanvasHeight / 2, 20, CanvasHeight, wallOptions);
    const rightWall = Bodies.rectangle(CanvasWidth + 10, CanvasHeight / 2, 20, CanvasHeight, wallOptions);
    const ceiling = Bodies.rectangle(CanvasWidth / 2, -10, CanvasWidth, 20, wallOptions);

    Composite.add(world, [ground, leftWall, rightWall, ceiling]);

    // Game Loop Variables
    let lastTime = performance.now();
    let frameCount = 0;
    let lastFpsUpdate = performance.now();
    let currentFps = 60;

    // Input State
    const keys = {
      left: false,
      right: false,
      up: false,
      space: false,
      reset: false
    };

    window.addEventListener('keydown', (e) => {
      sound.unlock();
      if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.up = true;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
      if (e.code === 'KeyR') keys.reset = true;
      if (e.code === 'KeyM') {
        const isMuted = sound.toggleMute();
        soundIcon.textContent = isMuted ? '🔇' : '🔊';
        soundText.textContent = isMuted ? 'SOUND OFF' : 'SOUND ON';
      }
    });

    window.addEventListener('click', () => {
      sound.unlock();
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowUp', 'KeyW', 'Space'].includes(e.code)) keys.up = false;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
      if (e.code === 'KeyR') keys.reset = false;
    });

    // Render Background Grid / Warm Floor placeholder for Milestone 1
    function renderBackground() {
      // Warm living room gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, CanvasHeight);
      bgGrad.addColorStop(0, '#2e1f38');
      bgGrad.addColorStop(0.7, '#24172e');
      bgGrad.addColorStop(1, '#1b1123');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, CanvasWidth, CanvasHeight);

      // Parquet floor styling on ground
      ctx.fillStyle = '#4a2818';
      ctx.fillRect(0, CanvasHeight - 40, CanvasWidth, 40);
      ctx.fillStyle = '#6b3a20';
      ctx.fillRect(0, CanvasHeight - 40, CanvasWidth, 4);

      // Floor plank lines
      ctx.strokeStyle = '#381e12';
      ctx.lineWidth = 2;
      for (let x = 0; x < CanvasWidth; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, CanvasHeight - 40);
        ctx.lineTo(x, CanvasHeight);
        ctx.stroke();
      }
    }

    // Instantiate Player (Pati)
    const pati = new PatiController(140, CanvasHeight - 60);

    // Main Game Loop
    function gameLoop(now) {
      const delta = Math.min(now - lastTime, 50);
      lastTime = now;

      // Update Player Controller & Physics
      pati.update(delta, keys, []);

      // Update Physics Engine with fixed sub-steps
      Engine.update(engine, 1000 / 60);

      // FPS tracking
      frameCount++;
      if (now - lastFpsUpdate >= 1000) {
        currentFps = frameCount;
        frameCount = 0;
        lastFpsUpdate = now;
        document.getElementById('fps-badge').textContent = `${currentFps} FPS`;
      }

      // Render Scene
      ctx.clearRect(0, 0, CanvasWidth, CanvasHeight);
      renderBackground();

      // Render Player
      pati.render(ctx);

      requestAnimationFrame(gameLoop);
    }

    // Start Game
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
